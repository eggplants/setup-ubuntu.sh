# Loaded with `dconf load /` by the setup:desktop task.

[org/gnome/desktop/input-sources]
sources=[('xkb', 'jp'), ('ibus', 'mozc-jp')]

[org/gnome/desktop/default-applications/terminal]
exec='ghostty'
exec-arg=''

[org/gnome/desktop/interface]
text-scaling-factor=1.0
scaling-factor=uint32 1

[org/gnome/shell]
enabled-extensions=['runcat@kolesnikov.se', 'caffeine@patapon.info']
favorite-apps=['org.gnome.Nautilus.desktop', 'org.gnome.Rhythmbox3.desktop', 'com.mitchellh.ghostty.desktop', 'google-chrome.desktop']

[org/gnome/shell/extensions/dash-to-dock]
extend-height=false
dock-position='BOTTOM'
dash-max-icon-size=16
intellihide=false
dock-fixed=false

[org/gnome/shell/extensions/ding]
show-home=false
